<style>
/* layout: wide web page; a dusk-sky archipelago of 12 floating isometric islands joined by branching light trails. One committed look (night-to-dawn sky), not theme-switched. */
:root{
  color-scheme:dark;
  --bg:#14173F; --panel:rgba(255,255,255,.075); --edge:rgba(255,255,255,.16); --fg:#F4F2FF; --soft:#B5B3DC;
  --gold:#FFD166; --gold-d:#C98A1B; --coral:#F2788F; --teal:#4FD1B8; --ink:#23265A;
  --display:"Baloo 2","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Nunito","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(1100px 620px at 85% -10%,#3B2F86 0,transparent 62%),radial-gradient(900px 560px at -5% 105%,#5A2E6E 0,transparent 60%),var(--bg);background-attachment:fixed;color:var(--fg);font-family:var(--body);font-size:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;text-wrap:balance}
h1{font-size:clamp(34px,5vw,58px)} h2{font-size:24px} h3{font-size:18px}
p{margin:0}
.sub{color:var(--soft);font-size:14px}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pad{padding:18px}
.btn{background:rgba(255,255,255,.1);border:1px solid var(--edge);padding:10px 18px;font-weight:800;border-radius:999px;transition:transform .12s,background .15s}
.btn:hover{background:rgba(255,255,255,.18)}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(180deg,#FFE08A,#FFB93B);color:var(--ink);border:0;box-shadow:0 5px 0 var(--gold-d),0 12px 24px rgba(255,185,59,.28)}
.btn.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-d)}
.btn.sm{padding:6px 14px;font-size:13.5px}
.btn.rd{width:40px;height:40px;padding:0;border-radius:50%;font-size:18px}
.btn[disabled]{opacity:.3;cursor:default}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)}
.seg button{border:0;background:none;padding:6px 14px;font-weight:800;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--gold));width:0;transition:width .4s}
.chip{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--gold);color:var(--ink);white-space:nowrap}
.d1{background:#7BE0C3}.d2{background:#FFD166}.d3{background:#FF9DB0}.d4{background:#B9A7FF}
.sky{background:linear-gradient(180deg,#1A1D57 0%,#3D3187 38%,#9A5AA6 68%,#F08FA0 87%,#FFC08A 100%);border-radius:26px;position:relative;overflow:hidden;border:1px solid var(--edge)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{padding:12px 6px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--soft);font-weight:700}
/* home */
.home-hero{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,9fr);gap:18px}
.home-hero .txt{display:flex;flex-direction:column;gap:14px;justify-content:center;padding:26px}
.home-hero .sky{min-height:340px}
.home-hero .sky svg{position:absolute;inset:0;width:100%;height:100%}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;list-style:none;margin:0;padding:0}
.steps li{padding:16px;display:flex;gap:12px;align-items:center;font-size:14px}
.steps b{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--ink)}
.steps li:nth-child(1) b{background:var(--gold)}.steps li:nth-child(2) b{background:#9CC4FF}.steps li:nth-child(3) b{background:#FF9DB0}
.mod{display:flex;flex-direction:column;gap:12px}
.mod.soon{border-style:dashed;background:none;opacity:.75}
/* map */
.world{cursor:default}
.world-scroll{overflow-x:auto;border-radius:26px}
.world svg{display:block;width:100%;min-width:900px;height:auto;transition:transform .7s cubic-bezier(.6,0,.4,1),opacity .6s .1s}
.world.dive svg{transform:scale(4.5);opacity:0}
.isle{cursor:pointer;outline:none}
.isle .fl{animation:bobm 3.6s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.8s);transition:filter .2s}
.isle:hover .fl,.isle:focus-visible .fl{filter:brightness(1.12) drop-shadow(0 0 14px rgba(255,220,140,.7))}
.isle text{font-family:var(--display);fill:#fff;text-anchor:middle}
.trail{fill:none;stroke-linecap:round}
.lit{filter:drop-shadow(0 0 5px #FFD166)}
.tw{animation:tw 2.4s ease-in-out infinite alternate}
.mark{animation:bobm 0.8s ease-in-out infinite alternate}
/* city */
.stage{min-height:380px;display:flex;flex-direction:column;perspective:900px}
.stage .top{position:relative;z-index:2;padding:18px 18px 0;display:flex;gap:10px;align-items:flex-start}
.stage .tilt{flex:1;display:grid;place-items:center;transform-style:preserve-3d;transition:transform .15s ease-out}
.stage .tilt svg{width:min(78%,400px);height:auto;overflow:visible;animation:bobs 3.4s ease-in-out infinite alternate;filter:drop-shadow(0 26px 22px rgba(20,10,60,.45))}
.stage .tilt.zoom{animation:czoom .7s cubic-bezier(.2,.9,.3,1.1) both}
.stage .tilt.fr{animation:cfr .5s cubic-bezier(.2,.9,.3,1.1) both}
.stage .tilt.fl2{animation:cfl .5s cubic-bezier(.2,.9,.3,1.1) both}
.stage .foot{position:relative;z-index:2;padding:0 18px 16px;display:flex;align-items:center;gap:12px;color:#fff}
.grid{display:grid;grid-template-columns:54px repeat(4,1fr);gap:10px;align-items:stretch}
.grid .th{font-size:12.5px;font-weight:800;text-align:center;align-self:end;color:var(--soft);line-height:1.7}
.grid .rh{font-family:var(--display);font-size:15px;align-self:center;line-height:1.1;color:var(--soft)}
.lv{padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px;min-width:0;background:rgba(255,255,255,.1);border:1px solid var(--edge);box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .12s,background .15s}
.lv:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.lv:active{transform:translateY(4px);box-shadow:none}
.lv b{font-family:var(--display);font-size:20px;line-height:1}
.lv small{font-size:11.5px;color:var(--soft);font-weight:700}
.lv .st{font-size:12px;letter-spacing:1px;color:var(--gold)}
.lv.ok{background:linear-gradient(180deg,rgba(255,209,102,.34),rgba(255,209,102,.14));border-color:rgba(255,209,102,.6)}
.none{border:1px dashed var(--edge);border-radius:16px;display:grid;place-items:center;color:var(--soft);font-size:12px;min-height:72px}
/* game */
.play{max-width:940px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:12px}
.tile{--c:#FFE1EC;--d:#D59CB3;min-height:96px;padding:8px 7px;border:0;border-radius:18px;background:var(--c);color:var(--ink);box-shadow:0 6px 0 var(--d),0 12px 18px rgba(8,6,40,.35);font-weight:800;font-size:14px;line-height:1.2;overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;text-align:center;min-width:0;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px)}
.tile.au{background:linear-gradient(180deg,#FFE08A,#FFB93B);--d:#C98A1B;flex-direction:column;gap:5px}
.tile.au svg{width:34px;height:34px}
.tile.au span{font-size:12px}
.tile.tx.c1{--c:#DCEBFF;--d:#9DB9E6}.tile.tx.c2{--c:#EAE3FF;--d:#B3A5E6}.tile.tx.c3{--c:#DBF7E9;--d:#9AD3B8}
.tile.sel{transform:translateY(-5px);box-shadow:0 11px 0 var(--d),0 0 0 4px #fff,0 0 26px 6px rgba(255,255,255,.5)}
.tile.playing svg{animation:bob .5s ease-in-out infinite alternate}
.board .tile.bad{animation:shake .35s;background:#FF8FA3}
.board .tile.gone{animation:pop .32s forwards;pointer-events:none}
.board.over .tile{opacity:.3;pointer-events:none}
.toast{min-height:56px;padding:8px 16px;font-size:14.5px;display:flex;align-items:center;gap:10px}
.toast b{color:var(--gold)}
.face{flex:none;width:42px;height:42px;display:block;background:#fff;border-radius:50%;padding:3px}.face svg{width:100%;height:100%;display:block}
.face.yay{animation:jump .45s}.face.oops{animation:shake .35s}
.combo{background:var(--coral);color:#fff;padding:1px 12px;border-radius:999px;font-family:var(--display);font-size:16px}
.combo.hit{animation:hit .4s}
.score{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
/* result + record */
.narrow{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.stars{font-size:54px;letter-spacing:8px;color:var(--gold);text-align:center;line-height:1;text-shadow:0 0 24px rgba(255,209,102,.6)}
.stars .off{color:rgba(255,255,255,.18);text-shadow:none}
.stars span{display:inline-block;animation:tin .45s both;animation-delay:calc(var(--i)*.22s + .2s)}
.rev{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.rev li{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:14px;min-width:0}
.rev .pl{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--gold);color:var(--ink);font-size:12px;padding:0}
.rev em{font-style:normal;color:var(--soft);font-size:12.5px;display:block}
.mk{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--ink)}
.mk.y{background:var(--teal)}.mk.n{background:var(--coral);color:#fff}
details{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:0 16px}
details[open]{padding-bottom:14px}
summary{cursor:pointer;padding:10px 0;font-weight:800;display:flex;gap:10px;align-items:center}
summary svg{width:46px;height:auto;flex:none}
.lrec{border-top:1px dashed var(--edge);padding:10px 0 2px;display:flex;flex-direction:column;gap:7px}
.lrec .hd{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:13.5px}
.ws{display:flex;flex-wrap:wrap;gap:6px}
.w{font-size:12.5px;padding:3px 9px;border-radius:9px;color:var(--ink);font-weight:700}
.w.y{background:#CFF3E3}.w.n{background:#FFC9D3}
.empty{text-align:center;padding:26px 16px;color:var(--soft)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* motion */
.app.in>*{animation:rise .45s cubic-bezier(.2,.9,.3,1.1) both}
.app.in>*:nth-child(2){animation-delay:.06s}.app.in>*:nth-child(3){animation-delay:.12s}.app.in>*:nth-child(n+4){animation-delay:.18s}
@keyframes rise{from{opacity:0;translate:0 22px}}
@keyframes tin{from{opacity:0;scale:.3}60%{scale:1.08}}
@keyframes bobm{to{transform:translateY(-7px)}}
@keyframes bobs{to{translate:0 -12px}}
@keyframes tw{from{opacity:.15}to{opacity:.95}}
@keyframes czoom{from{opacity:0;scale:.15}}
@keyframes cfr{from{opacity:0;translate:60% 0;scale:.6}}
@keyframes cfl{from{opacity:0;translate:-60% 0;scale:.6}}
@keyframes hit{0%{scale:.4;rotate:-12deg}60%{scale:1.35;rotate:6deg}}
@keyframes jump{40%{translate:0 -10px;rotate:-12deg}70%{rotate:10deg}}
@keyframes bob{to{transform:scale(1.2)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{60%{transform:scale(1.15)}100%{transform:scale(0);visibility:hidden}}
.board.enter .tile,.grid .lv{animation:tin .36s both;animation-delay:calc(var(--i,0)*22ms + .12s)}

.drop{animation:dropin .7s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes dropin{from{opacity:0;transform:translateY(-4px) scale(.4)}}
.cl{animation:drift var(--d,40s) ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(var(--x,80px))}}
.world .fl{animation:bobm 3.6s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.8s)}
.birds{animation:fly 46s linear infinite}
@keyframes fly{from{transform:translate(-90px,330px)}to{transform:translate(1300px,150px)}}
.shoot{animation:shoot 9s linear infinite}
@keyframes shoot{0%,84%{opacity:0;transform:translate(860px,40px)}86%{opacity:1;transform:translate(860px,40px)}100%{opacity:0;transform:translate(600px,144px)}}
.grown{display:grid;place-items:center}.grown svg{width:220px;height:auto;overflow:visible;filter:drop-shadow(0 16px 16px rgba(20,10,60,.45))}
.none b{font-family:var(--display);font-size:17px;line-height:1;opacity:.6}
.none{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:3px}
.duo{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:14px;align-items:start}
.col{padding:14px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,box-shadow .2s,opacity .2s}
.col h3{display:flex;align-items:center;gap:8px}
.num{width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--ink);display:grid;place-items:center;font-size:15px}
.col.act{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,209,102,.35),0 0 30px rgba(255,209,102,.18)}
.col.act .num{background:var(--gold)}

.ag{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}

@media (max-width:820px){.duo{grid-template-columns:minmax(0,1fr) minmax(0,1.700fr);gap:8px}.col{padding:8px;gap:8px}.board{gap:8px}.ag{grid-template-columns:repeat(auto-fill,minmax(48px,1fr))}.tg{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}.ag .tile{min-height:60px;padding:4px;border-radius:14px}.ag .tile svg{width:24px;height:24px}.tg .tile{min-height:60px;font-size:12.500px;border-radius:14px}}

/* cover */
.cover{min-height:540px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:40px}
.cover>svg{position:absolute;inset:0;width:100%;height:100%;min-width:0;transition:none}

.ctxt{display:flex;flex-direction:column;gap:22px;align-items:flex-start}

/* themed particles */
.pfx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.pfx i{position:absolute;display:block;opacity:.85;font-style:normal;font-weight:800;font-size:15px;font-family:var(--display)}
.s-dot{width:7px;height:7px;border-radius:50%}.s-leaf{width:11px;height:11px;border-radius:0 100% 0 100%}.s-streak{width:38px;height:2px;border-radius:2px;opacity:.5!important}.s-sq{width:8px;height:10px;border-radius:2px}.s-dia{width:8px;height:8px;rotate:45deg}

  .duo{grid-template-columns:minmax(0,1fr) minmax(0,1.600fr);gap:8px}.duo .board{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.duo .tile{height:70px;font-size:12px;line-height:1.15;padding:3px 5px;border-radius:14px}.duo .tile.au svg{width:24px;height:24px}}

/* city: test cards + boss entry */
.cside{display:flex;flex-direction:column;gap:14px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* Spacious play surface and a quiet, illustrated world. */
body{margin:0;padding:26px clamp(14px,3vw,56px) 42px}
.app{max-width:1440px;position:relative;z-index:1}
.play{max-width:1320px;gap:16px}

}
/* ================= reading advanced: a source sentence with the wording highlighted, pick the question wording ================= */
/* where the passage wording sits inside its sentence: exact match or complete ordered fragments; never guess a highlight from scattered words */
function spansOf(p){if(!p.s)return null;if(p._sp!==undefined)return p._sp;

      ding(HP-hp);e.classList.add('right');msg.innerHTML=`<b style="color:var(--gold)">命中！</b> ${esc(cur.t)} → ${esc(cur.q)} <span class="sub">${esc(cur.zh)}</span>`;
      if(!slipped.has(w))srsHit(w);else S.srs[w]={lv:0,due:Date.now()+DAY};
    }else{hearts--;slipped.add(w);srsMiss(w);queue.push(cur);
      fx(mon,'lunge',600);scheduleView(()=>{fx(hero,'ouch',450);fx(document.getElementById('arena'),'shake',400);buzz()},260);
      if(e)e.classList.add('wrong');good.classList.add('right');
      const h=document.getElementById('hearts');h.textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);h.setAttribute('aria-label','剩余 '+hearts+' 颗心');
      msg.innerHTML=`${e?'答错了':'超时了'}，妖怪反击！正确答案：<b style="color:var(--gold)">${esc(shown(cur))}</b> <span class="sub">${esc(cur.zh)}</span>。这一题稍后还会再出现。`}
    persist();scheduleView(next,ok?1500:2300);
  }
  function win(){clearInterval(timer);if(b!=null)S.boss[b]=(S.boss[b]||0)+1;persist();fx(mon,'dead');fanfare();rain();
    scheduleView(()=>transitionTo(()=>{setScene("result");app.innerHTML=`<div class="narrow"><div class="grown deadm">${monsterSvg(ci)}</div><h2 style="text-align:center;font-size:30px">妖怪被打败了！</h2>
      <p class="sub" style="text-align:center">复习了 ${HP} 组，${HP-slipped.size} 组一次答对。还想巩固一下？可以继续挑战。</p>
      <div class="row" style="justify-content:center">${b!=null?`<button class="btn go" id="city">回到${CFG.place}</button>`:''}<button class="btn" id="again-review">再挑战一次</button><button class="btn" id="rec">查看学习记录</button></div>
      <ul class="rev">${pool.map(p=>pairLi(p,!slipped.has(p.b+'|'+p.idx),!!directions.get(p.b+'|'+p.idx))).join('')}</ul></div>`;
      on('again-review',()=>viewBoss(b,pool),1);on('city',()=>viewCity(b));on('rec',()=>viewRecord(viewHome));bindPlay();enter()}),1100)}
  function lose(){transitionTo(()=>{setScene('result');clearInterval(timer);note(392,0,.6,.13);note(293.66,.22,.9,.13);
    app.innerHTML=`<div class="narrow"><div class="grown">${monsterSvg(ci)}</div><h2 style="text-align:center;font-size:30px">妖怪还剩 ${hp} 格血</h2>
      <p class="sub" style="text-align:center">三颗心用完了。再听一听，再战一次，继续本次还没完成的词组。</p>
      <div class="row" style="justify-content:center"><button class="btn go" id="retry">再战一次</button>${b!=null?`<button class="btn" id="city">回到${CFG.place}</button>`:''}</div>
      <ul class="rev">${pool.filter(p=>slipped.has(p.b+'|'+p.idx)).map(p=>pairLi(p,false,!!directions.get(p.b+'|'+p.idx))).join('')}</ul></div>`;
    on('retry',()=>viewBoss(b,pool.filter(p=>!cleared.includes(p))),1);on('city',()=>viewCity(b));bindPlay();enter()})}
  bindSnd();
  on('review-slow',()=>{save.slow=!save.slow;persist();const e=document.getElementById('review-slow');e.textContent=save.slow?'🐢 慢速':'🐇 常速';e.setAttribute('aria-pressed',save.slow);if(cur&&!busy)say(spoken(cur),document.getElementById('say'))});
  document.getElementById('say').onclick=()=>{if(cur&&canSay())say(spoken(cur),document.getElementById('say'))};
  on('back',()=>{clearInterval(timer);stopSpeech();b==null?viewRecord(viewHome):viewCity(b)});
  scheduleView(next,700);
}

/* ================= learning record ================= */
function viewRecord(back){
  stopSpeech();
  setScene("record");
  const T=totals(),wk=wrongIn();
  const nd=reviewCount();
  const wrong=wk.sort((a,b)=>srsOf(a).due-srsOf(b).due||S.wrong[b]-S.wrong[a]).slice(0,40).map(w=>({...pairOf(w),n:S.wrong[w],w}));
  const books=BOOKS.map((b,i)=>{const o=order(b),done=o.filter(t=>recOf(b,t));if(!done.length)return'';
    return `<details><summary>${isleSvg(i,builtCount(i,done.length,o.length))}<span class="grow">剑${b}</span><span class="sub">${done.length}/${o.length} 关${S.boss[b]?` · 击败妖怪 ×${S.boss[b]}`:''}</span></summary>${done.map(t=>{const r=recOf(b,t),L=testPairs(b,t);
      return `<div class="lrec"><div class="hd"><b>${levelName(t)}</b><span style="color:var(--gold)">${starStr(r.s)}</span><span class="sub">一次答对 ${L.filter(p=>!r.miss.includes(p.idx)).length}/${L.length} · 练了 ${r.n} 次 · ${r.d}</span></div>
      <div class="ws">${L.map(x=>{const m=r.miss.includes(x.idx);return `<span class="w ${m?'n':'y'}">${m?'✗':'✓'} ${esc(x.t)} → ${esc(x.q)}</span>`}).join('')}</div></div>`}).join('')}</details>`}).join('');
  app.innerHTML=`<div class="row"><button class="btn sm" id="back">← 返回</button><h2 class="grow">学习记录</h2><div class="seg" role="group" aria-label="模块"><button id="rm-L" aria-pressed="${MODE==='L'}">听力</button><button id="rm-R" aria-pressed="${MODE==='R'}">阅读</button></div></div>
  ${statsHtml(T)}
  ${T.lv?`<div class="row"><h3 class="grow">错词本 <span class="sub">${wk.length} 组 · 建议今日复习 ${nd} 组</span></h3>${wk.length?`<button class="btn go sm" id="boss">${nd?'开始复习':'再巩固一次'}</button>`:''}</div>
  ${wrong.length?`<ul class="rev">${wrong.map(p=>`<li><span class="mk n">${p.n}</span>${canSay()?`<button class="pl" data-t="${esc(p.t)}" aria-label="播放 ${esc(p.t)}">▶</button>`:''}<div class="grow"><b>${esc(p.t)}</b> → ${esc(p.q)}<em>${esc(p.zh)} · 剑${p.b} ${p.src} 第 ${p.no} 题</em></div><span class="due ${isDue(p.w)?'now':''}"><i>${'●'.repeat(srsOf(p.w).lv)}${'○'.repeat(INTV.length+1-srsOf(p.w).lv)}</i>${dueLabel(p.w)}</span></li>`).join('')}</ul>`:'<div class="empty card">错词本是空的，保持住！</div>'}
  <h3>各站记录</h3>${books}`
  :`<div class="empty card">${CFG.name}还没有记录，先去通过第一关吧。</div>`}`;
  ['L','R'].forEach(m=>{document.getElementById('rm-'+m).onclick=()=>{save.mode=m;persist();setMode(m);viewRecord(back)}});
  on('back',back);on('boss',()=>viewBoss(null),1);bindPlay();enter();
}
/* All complete screens share a short transition; rapid navigation keeps only the latest destination. */
let activeTransition=null,transitionSerial=0,insideTransition=false,transitionAnimations=[],legacyArrival=false;
function legacyMapEntry(){transitionSerial++;activeTransition?.skipTransition();activeTransition=null;transitionAnimations.forEach(a=>a.cancel());transitionAnimations=[];legacyArrival=true;insideTransition=true;try{viewMap()}finally{insideTransition=false;legacyArrival=false}}
function animateArrival(){
 transitionAnimations.forEach(a=>a.cancel());transitionAnimations=[];
 if(RM)return;
 const root=app.firstElementChild;
 const blocks=[...app.children].length>1?[...app.children]:root?[...root.children]:[];
 blocks.filter(e=>!e.matches('style,script')).slice(0,9).forEach((e,i)=>{
  transitionAnimations.push(e.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'translateY(0)'}],{duration:440,delay:Math.min(i*32,160),easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}));
 });
 const veil=document.getElementById('journey-fx');veil.getAnimations({subtree:true}).forEach(a=>a.cancel());
 const journey=document.body.dataset.screen==='map'||document.body.dataset.screen==='city';
 veil.dataset.kind=journey?'travel':'focus';
 transitionAnimations.push(veil.animate([{opacity:0,transform:'scale(.94)'},{opacity:journey?.7:.48,offset:.28},{opacity:0,transform:'scale(1.04)'}],{duration:660,easing:'ease-out'}));
 veil.querySelectorAll('i').forEach((e,i)=>transitionAnimations.push(e.animate([{opacity:0,transform:'translateY(16px) scale(.5)'},{opacity:.7,offset:.3},{opacity:0,transform:'translateY(-30px) scale(1)'}],{duration:600,delay:i*24,easing:'ease-out'})));
}
function transitionTo(render){
 if(insideTransition)return render();
 const serial=++transitionSerial;
 if(activeTransition){activeTransition.skipTransition();activeTransition=null}
 const update=()=>{
  if(serial!==transitionSerial)return;
  insideTransition=true;
  try{render()}finally{insideTransition=false}
 };
 if(!app.firstElementChild||RM||!document.startViewTransition){update();return}
 document.documentElement.dataset.journey=document.body.dataset.screen||'home';
 const vt=document.startViewTransition(update);activeTransition=vt;
 vt.ready.catch(()=>{});
 vt.finished.catch(()=>{}).finally(()=>{if(activeTransition===vt)activeTransition=null});
}
const journeyFx=document.createElement('div');journeyFx.id='journey-fx';journeyFx.setAttribute('aria-hidden','true');journeyFx.innerHTML='<span></span>'+Array.from({length:9},(_,i)=>`<i style="left:${8+i*10.5}%;top:${28+(i*17)%48}%">✦</i>`).join('');document.body.appendChild(journeyFx);
const screenTransition=fn=>function(...args){return transitionTo(()=>fn(...args))};
viewHome=screenTransition(viewHome);viewMap=screenTransition(viewMap);viewMapR=screenTransition(viewMapR);viewCity=screenTransition(viewCity);viewGame=screenTransition(viewGame);viewQuiz=screenTransition(viewQuiz);viewResult=screenTransition(viewResult);viewBoss=screenTransition(viewBoss);viewRecord=screenTransition(viewRecord);reviewEmpty=screenTransition(reviewEmpty);

viewHome();
</script>
